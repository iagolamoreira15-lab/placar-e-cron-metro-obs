<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Placar</title>
<style>html,body{margin:0;background:transparent;overflow:hidden;font-family:Arial;color:#fff}#board{width:760px;margin:15px auto;background:rgba(8,8,12,.9);border-radius:16px;padding:15px 22px;text-shadow:0 2px 4px #000}.comp{text-align:center;font-size:15px;letter-spacing:1.5px;opacity:.8;margin-bottom:8px}.line{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px}.team{text-align:center;font-size:26px;font-weight:800}.score{font-size:48px;font-weight:900;white-space:nowrap}.time{text-align:center;font-size:18px;font-weight:800;margin-top:7px}.period{text-align:center;font-size:12px;opacity:.7;margin-top:3px}</style></head><body><div id="board"><div class="comp" id="comp">CHAMPIONS LEAGUE</div><div class="line"><div class="team" id="home">NAPOLI</div><div class="score"><span id="hs">0</span> × <span id="as">0</span></div><div class="team" id="away">ARSENAL</div></div><div class="time">⏱️ <span id="clock">00:00</span><span id="add"></span></div><div class="period" id="period">1º TEMPO</div></div>
<script>
async function load(){try{let r=await fetch('/api/score?x='+Date.now(),{cache:'no-store'});let d=await r.json();document.getElementById('home').textContent=d.home||'CASA';document.getElementById('away').textContent=d.away||'FORA';document.getElementById('comp').textContent=d.competition||'COMPETIÇÃO';document.getElementById('hs').textContent=d.homeScore??0;document.getElementById('as').textContent=d.awayScore??0;let s=d.seconds??0;document.getElementById('clock').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');document.getElementById('add').textContent=Number(d.added)?' +'+d.added:'';document.getElementById('period').textContent=d.period||'1º TEMPO'}catch(e){}}load();setInterval(load,1000);
</script></body></html>
